<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spånsug Dashboard - FabLab</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='roof' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%23e36452;stop-opacity:1'/><stop offset='100%' style='stop-color:%23943f3f;stop-opacity:1'/></linearGradient><linearGradient id='walls' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%23b09999;stop-opacity:1'/><stop offset='100%' style='stop-color:%23e1d7d7;stop-opacity:1'/></linearGradient><linearGradient id='window' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%2300ffff;stop-opacity:1'/><stop offset='100%' style='stop-color:%2300b2ff;stop-opacity:1'/></linearGradient></defs><path d='M10 35 L50 10 L90 35 Z' fill='url(%23roof)' stroke='%23943f3f' stroke-width='1.5'/><rect x='15' y='35' width='70' height='50' rx='2' fill='url(%23walls)' stroke='%23943f3f' stroke-width='1'/><rect x='25' y='45' width='12' height='12' fill='url(%23window)' stroke='%2300b2ff' stroke-width='0.5'/><rect x='63' y='45' width='12' height='12' fill='url(%23window)' stroke='%2300b2ff' stroke-width='0.5'/><rect x='25' y='65' width='12' height='12' fill='url(%23window)' stroke='%2300b2ff' stroke-width='0.5'/><rect x='63' y='65' width='12' height='12' fill='url(%23window)' stroke='%2300b2ff' stroke-width='0.5'/><rect x='44' y='20' width='4' height='45' fill='%23483737' stroke='%23483737' stroke-width='0.5'/><circle cx='46' cy='18' r='2.5' fill='%23ffb200' stroke='%23ff9900' stroke-width='0.5'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .connection-status {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-connected {
            background: #10b981;
        }
        
        .status-disconnected {
            background: #ef4444;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .gates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .gate-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .gate-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        
        .gate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .gate-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        
        .gate-status {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .status-label {
            font-weight: 600;
            color: #666;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .badge-open {
            background: #10b981;
            color: white;
        }
        
        .badge-closed {
            background: #ef4444;
            color: white;
        }
        
        .badge-wait {
            background: #f59e0b;
            color: white;
        }
        
        .badge-unknown {
            background: #6b7280;
            color: white;
        }
        
        .badge-active {
            background: #3b82f6;
            color: white;
        }
        
        .badge-inactive {
            background: #9ca3af;
            color: white;
        }
        
        .last-update {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .log-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .log-header h2 {
            margin: 0;
            color: #333;
            font-size: 1.5em;
        }

        .log-clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .log-clear-btn:hover {
            background: #dc2626;
        }

        .log-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
        }

        .log-entry {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry.on {
            background: #f0fdf4;
        }

        .log-entry.off {
            background: #fef2f2;
        }

        .log-info {
            flex: 1;
        }

        .log-gate {
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .log-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 4px;
            margin-right: 8px;
        }

        .log-status.on {
            background: #10b981;
            color: white;
        }

        .log-status.off {
            background: #6c757d;
            color: white;
        }

        .log-time {
            text-align: right;
            color: #666;
            font-size: 0.9em;
            white-space: nowrap;
        }

        .log-empty {
            padding: 30px;
            text-align: center;
            color: #999;
        }
            opacity: 0.8;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏭 Spånsug Dashboard</h1>
        
        <div class="connection-status">
            <div>
                <span class="status-indicator" id="mqtt-indicator"></span>
                <span id="mqtt-status">Forbinder...</span>
            </div>
            <div style="display: flex; gap: 20px; align-items: center;">
                <div id="vacuum-status" style="font-weight: bold;">
                    <span style="margin-right: 8px;">⚙️ Spånsug:</span>
                    <span id="vacuum-state" class="status-badge badge-inactive">Ukendt</span>
                </div>
                <div id="dashboard-version" style="font-size: 0.9em; color: #666; font-weight: 600;"></div>
                <div id="mqtt-server"></div>
            </div>
        </div>
        
        <div class="gates-grid" id="gates-grid">
            <div class="no-data">Venter på data fra MQTT...</div>
        </div>
        
        <div class="last-update" id="last-update"></div>

        <!-- Event Log Section -->
        <div class="log-section">
            <div class="log-header">
                <h2>📋 Aktivitetslog - Spånsug</h2>
                <button class="log-clear-btn" onclick="clearEventLog()">Ryd Log</button>
            </div>
            <div class="log-list" id="log-list">
                <div class="log-empty">Ingen aktiviteter endnu</div>
            </div>
        </div>

    <script>
        const DASHBOARD_VERSION = 'v2.1.0';

        // MQTT Configuration
        const MQTT_BROKER = 'ws://spansug-backend.local:9001'; // WebSocket port
        const MQTT_TOPIC = 'spansug/#';
        
        // Predefined gates
        const PREDEFINED_GATES = [
            { id: 'stor_cnc', name: 'Stor CNC' },
            { id: 'lille_cnc', name: 'Lille CNC' },
            { id: 'rundsav', name: 'Rundsav' },
            { id: 'disponibel_1', name: 'Disponibel 1' },
            { id: 'disponibel_2', name: 'Disponibel 2' },
            { id: 'rondelsliber', name: 'Rondelsliber', hasSensor: true },
            { id: 'baandsliber', name: 'Båndsliber' }
        ];
        
        // State
        const gates = new Map();
        let vacuumActive = false;
        let client = null;
        let sensorTimeouts = new Map(); // Track sensor activity
        let eventLog = []; // Track state changes for log
        const MAX_LOG_ENTRIES = 100; // Keep last 100 entries
        const VACUUM_GATE_ID = 'rondelsliber'; // Track this gate specifically
        
        // Initialize all predefined gates
        function initializeGates() {
            PREDEFINED_GATES.forEach(gate => {
                gates.set(gate.id, {
                    id: gate.id,
                    name: gate.name,
                    hasSensor: gate.hasSensor || false,
                    sensorConnected: gate.hasSensor ? false : undefined,
                    state: 'unknown',
                    machine_active: false,
                    lastUpdate: new Date()
                });
            });
            renderGates();
        }
        
        // Connect to MQTT
        function connectMQTT() {
            updateStatus('Forbinder til MQTT...', false);
            
            client = mqtt.connect(MQTT_BROKER, {
                clientId: 'dashboard_' + Math.random().toString(16).substr(2, 8)
            });
            
            client.on('connect', () => {
                console.log('MQTT Connected');
                updateStatus('Forbundet til MQTT', true);
                document.getElementById('mqtt-server').textContent = MQTT_BROKER;
                
                client.subscribe(MQTT_TOPIC, (err) => {
                    if (err) {
                        console.error('Subscribe error:', err);
                    } else {
                        console.log('Subscribed to:', MQTT_TOPIC);
                    }
                });
            });
            
            client.on('message', (topic, message) => {
                handleMessage(topic, message.toString());
            });
            
            client.on('error', (err) => {
                console.error('MQTT Error:', err);
                updateStatus('MQTT Fejl', false);
            });
            
            client.on('close', () => {
                updateStatus('MQTT Forbindelse lukket', false);
                setTimeout(connectMQTT, 5000);
            });
        }
        
        function handleMessage(topic, payload) {
            console.log('Message:', topic, payload);
            
            // Check for vacuum status
            if (topic === 'spansug/vacuum/active') {
                vacuumActive = payload === '1';
                updateVacuumStatus();
                return;
            }
            
            // Parse topic: spansug/gate/{gate_id}/{property}
            const parts = topic.split('/');
            if (parts.length !== 4 || parts[0] !== 'spansug' || parts[1] !== 'gate') {
                return;
            }
            
            const gateId = parts[2];
            const property = parts[3];
            
            // Initialize gate if not exists (only if in PREDEFINED_GATES)
            if (!gates.has(gateId)) {
                const predefined = PREDEFINED_GATES.find(g => g.id === gateId);
                if (!predefined) {
                    // Ignore gates not in PREDEFINED_GATES
                    return;
                }
                gates.set(gateId, {
                    id: gateId,
                    name: predefined.name,
                    hasSensor: predefined.hasSensor || false,
                    sensorConnected: predefined.hasSensor ? false : undefined,
                    state: 'unknown',
                    machine_active: false,
                    lastUpdate: new Date()
                });
            }
            
            const gate = gates.get(gateId);
            
            if (property === 'heartbeat' && gate.hasSensor) {
                // Heartbeat from external sensor - mark as connected
                gate.sensorConnected = true;
                
                // Clear existing timeout
                if (sensorTimeouts.has(gateId)) {
                    clearTimeout(sensorTimeouts.get(gateId));
                }
                
                // Set timeout to mark sensor as offline after 10 seconds
                const timeout = setTimeout(() => {
                    gate.sensorConnected = false;
                    renderGates();
                }, 10000);
                
                sensorTimeouts.set(gateId, timeout);
                renderGates();
                updateLastUpdate();
                return;
            }
                
            // If gate has external sensor, track activity on machine_active too
            if (property === 'machine_active' && gate.hasSensor) {
                gate.sensorConnected = true;
                
                // Clear existing timeout
                if (sensorTimeouts.has(gateId)) {
                    clearTimeout(sensorTimeouts.get(gateId));
                }
                
                // Set timeout to mark sensor as offline after 10 seconds
                const timeout = setTimeout(() => {
                    gate.sensorConnected = false;
                    renderGates();
                }, 10000);
                
                sensorTimeouts.set(gateId, timeout);
            }
            
            if (property === 'state') {
                gate.state = payload.toLowerCase();
            } else if (property === 'machine_active') {
                const oldState = gate.machine_active;
                const newState = payload === '1';
                
                // Log only when state changes
                if (oldState !== newState) {
                    addEventLog(gateId, gate.name, newState);
                }
                
                gate.machine_active = newState;
            }
            
            gate.lastUpdate = new Date();
            
            renderGates();
            updateLastUpdate();
        }
        
        function updateStatus(message, connected) {
            const statusEl = document.getElementById('mqtt-status');
            const indicatorEl = document.getElementById('mqtt-indicator');
            
            statusEl.textContent = message;
            indicatorEl.className = 'status-indicator ' + 
                (connected ? 'status-connected' : 'status-disconnected');
        }
        
        function updateVacuumStatus() {
            const vacuumEl = document.getElementById('vacuum-state');
            if (vacuumActive) {
                vacuumEl.textContent = 'Kører';
                vacuumEl.className = 'status-badge badge-active';
            } else {
                vacuumEl.textContent = 'Stoppet';
                vacuumEl.className = 'status-badge badge-inactive';
            }
        }
        
        function renderGates() {
            const gridEl = document.getElementById('gates-grid');
            
            gridEl.innerHTML = '';
            
            // Sort gates by predefined order
            const sortedGates = Array.from(gates.entries()).sort((a, b) => {
                const indexA = PREDEFINED_GATES.findIndex(g => g.id === a[0]);
                const indexB = PREDEFINED_GATES.findIndex(g => g.id === b[0]);
                if (indexA === -1) return 1;
                if (indexB === -1) return -1;
                return indexA - indexB;
            });
            
            sortedGates.forEach(([id, gate]) => {
                const card = document.createElement('div');
                card.className = 'gate-card';
                
                const displayName = gate.name || formatGateId(id);
                
                card.innerHTML = `
                    <div class="gate-header">
                        <div class="gate-name">${displayName}</div>
                    </div>
                    <div class="gate-status">
                        <div class="status-row">
                            <span class="status-label">Spjæld:</span>
                            <span class="status-badge ${getStateBadgeClass(gate.state)}">
                                ${formatState(gate.state)}
                            </span>
                        </div>
                        <div class="status-row">
                            <span class="status-label">Maskine:</span>
                            <span class="status-badge ${gate.machine_active ? 'badge-active' : 'badge-inactive'}">
                                ${gate.machine_active ? 'Aktiv' : 'Inaktiv'}
                            </span>
                        </div>
                        ${gate.sensorConnected !== undefined ? `
                        <div class="status-row">
                            <span class="status-label">Sensor:</span>
                            <span class="status-badge ${gate.sensorConnected ? 'badge-active' : 'badge-inactive'}">
                                ${gate.sensorConnected ? '✓ Forbundet' : '✗ Offline'}
                            </span>
                        </div>
                        ` : ''}
                    </div>
                `;
                
                gridEl.appendChild(card);
            });
        }
        
        function formatGateId(id) {
            // Convert "stor_cnc" to "Stor CNC"
            return id.split('_').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }
        
        function formatState(state) {
            const states = {
                'open': 'Åben',
                'closed': 'Lukket',
                'wait': 'Venter',
                'unknown': 'Ukendt'
            };
            return states[state] || state;
        }
        
        function getStateBadgeClass(state) {
            const classes = {
                'open': 'badge-open',
                'closed': 'badge-closed',
                'wait': 'badge-wait',
                'unknown': 'badge-unknown'
            };
            return classes[state] || 'badge-unknown';
        }
        
        function updateLastUpdate() {
            const updateEl = document.getElementById('last-update');
            const now = new Date();
            updateEl.textContent = `Sidst opdateret: ${now.toLocaleTimeString('da-DK')}`;
        }

        function addEventLog(gateId, gateName, isActive) {
            // Log all machine_active state changes for all gates
            const entry = {
                timestamp: new Date(),
                gateId: gateId,
                gateName: gateName,
                active: isActive
            };

            eventLog.unshift(entry); // Add to beginning

            // Keep only last MAX_LOG_ENTRIES
            if (eventLog.length > MAX_LOG_ENTRIES) {
                eventLog.pop();
            }

            // Save to localStorage
            saveEventLog();

            // Update UI
            renderEventLog();
        }

        function saveEventLog() {
            const logData = eventLog.map(entry => ({
                timestamp: entry.timestamp.getTime(),
                gateId: entry.gateId,
                gateName: entry.gateName,
                active: entry.active
            }));
            localStorage.setItem('spansug-event-log', JSON.stringify(logData));
        }

        function loadEventLog() {
            const stored = localStorage.getItem('spansug-event-log');
            if (stored) {
                try {
                    const logData = JSON.parse(stored);
                    eventLog = logData.map(entry => ({
                        timestamp: new Date(entry.timestamp),
                        gateId: entry.gateId,
                        gateName: entry.gateName,
                        active: entry.active
                    }));
                    renderEventLog();
                } catch (e) {
                    console.error('Error loading event log:', e);
                }
            }
        }

        function renderEventLog() {
            const listEl = document.getElementById('log-list');

            if (eventLog.length === 0) {
                listEl.innerHTML = '<div class="log-empty">Ingen aktiviteter endnu</div>';
                return;
            }

            listEl.innerHTML = eventLog.map((entry, index) => {
                const time = entry.timestamp.toLocaleTimeString('da-DK');
                const date = entry.timestamp.toLocaleDateString('da-DK');
                const status = entry.active ? 'Tændt' : 'Slukket';
                const statusClass = entry.active ? 'on' : 'off';

                return `
                    <div class="log-entry ${statusClass}">
                        <div class="log-info">
                            <div class="log-gate">⚡ ${entry.gateName}</div>
                            <span class="log-status ${statusClass}">${status}</span>
                            <span style="color: #666; font-size: 0.9em;">${date}</span>
                        </div>
                        <div class="log-time">${time}</div>
                    </div>
                `;
            }).join('');
        }

        function clearEventLog() {
            if (confirm('Er du sikker på, at du vil slette hele aktivitetsloggen?')) {
                eventLog = [];
                localStorage.removeItem('spansug-event-log');
                renderEventLog();
            }
        }
        
        // Initialize
        document.getElementById('dashboard-version').textContent = `Dashboard ${DASHBOARD_VERSION}`;
        initializeGates();
        loadEventLog();
        connectMQTT();
        
        // Update clock every second
        setInterval(updateLastUpdate, 1000);
    </script>
</body>
</html>
